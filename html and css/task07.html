<!DOCTYPE html>
<html>
<head>
    <title>Footer with Social Links</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

    <style>
        /* Page */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        /* Footer heading */
        footer h2 {
            margin-bottom: 20px;
        }

        /* Social links */
        .social-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
            transition: 0.3s;
        }

        /* Hover effects */
        .facebook:hover {
            color: #1877f2;
        }

        .instagram:hover {
            color: #e4405f;
        }

        .twitter:hover {
            color: #1da1f2;
        }

        .youtube:hover {
            color: #ff0000;
        }

        /* Copyright */
        .copyright {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Footer -->
    <footer>

        <h2>Follow Us</h2>

        <div class="social-links">

            <a href="https://www.facebook.com/" class="facebook">Facebook</a>
            <i class="ri-facebook-line"></i>

            <a href="https://www.instagram.com/?hl=en" class="instagram">Instagram</a>
            <i class="ri-instagram-line"></i>

            <a href="https://x.com/" class="twitter">Twitter</a>
            <i class="ri-twitter-line"></i>

            <a href="https://www.youtube.com/" class="youtube">YouTube</a>
            <i class="ri-youtube-line"></i>

        </div>

        <p class="copyright">
            © 2026 My Website. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
