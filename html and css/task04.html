<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            /* Center the form */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Login box */
        .login-box {
            width: 300px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Heading */
        .login-box h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        /* Input fields */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        /* Login button */
        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Button hover */
        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <!-- Email -->
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                placeholder="Enter your email"
                required
            >

            <!-- Password -->
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
            >

            <!-- Button -->
            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
