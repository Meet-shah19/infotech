<!DOCTYPE html>
<html>
<head>
    <title>Responsive Card</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Card */
        .card {
            width: 350px;
            margin: 50px auto;
            background-color: lightblue;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer
        }
        .card :hover {
            background-color: #fcfeff;
        }
        /* Card image */
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        /* Card content */
        .card-content {
            padding: 20px;
        }

        .card h2 {
            margin-top: 0;
            color: #333;
        }

        .card p {
            color: #666;
            line-height: 1.5;
        }

        /* Button */
        .card button {
            background-color: #f90202;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #090909;
        }

        /* Mobile screen  :-If the screen width is 600px or smaller, the card changes its size to fit a mobile screen. */
        @media (max-width: 600px) {
            .card {
                width: 90%;
                margin: 30px auto;
            }

            .card img {
                height: 180px;
            }

            .card-content {
                padding: 15px;
            }

            .card h2 {
                font-size: 22px;
            }

            .card p {
                font-size: 14px;
            }

            .card button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Image -->
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085"
             alt="Coffee">

        <!-- Card Content -->
        <div class="card-content">
            <h2>Delicious Coffee</h2>

            <p>
                Enjoy a fresh and delicious cup of coffee
                made with high-quality coffee beans.
            </p>

            <button>Order Now</button>
        </div>

    </div>

</body>
</html>
